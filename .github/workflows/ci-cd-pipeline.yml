name: Enterprise CI/CD & Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck Verification
        run: npx tsc --noEmit

      - name: Universal Web Production Export
        run: npm run build:web

  deploy-ota:
    name: Continuous Over-The-Air (OTA) Hotfix Delivery
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish Instant OTA Update to Preview Channel
        run: |
          npx eas-cli@latest update --branch preview --environment preview --message "${{ github.event.head_commit.message }}" --non-interactive

  native-build-check:
    name: Native Hardware & Version Upgrade Audit
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Inspect Native Config Diffs
        id: native-diff
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E "(app\.json|eas\.json|package\.json)" || true)
          if [ -n "$CHANGED" ]; then
            echo "native_changed=true" >> $GITHUB_OUTPUT
            echo "Detected native configuration changes: $CHANGED"
          else
            echo "native_changed=false" >> $GITHUB_OUTPUT
            echo "No native config modifications detected."
          fi
