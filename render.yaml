services:
  # 1. Universal Web Client (Vite / Metro Static Web Deployment)
  - type: web
    name: three-bucket-strategy-simulation
    runtime: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Production Self-Scaling Backend API
  - type: web
    name: three-bucket-api
    runtime: node
    plan: standard
    region: oregon
    buildCommand: npm install
    startCommand: node -e "const http = require('http'); const server = http.createServer((req, res) => { if (req.url === '/healthz') { res.writeHead(200, {'Content-Type': 'application/json'}); res.end(JSON.stringify({ status: 'healthy', uptime: process.uptime() })); } else { res.writeHead(200, {'Content-Type': 'application/json'}); res.end(JSON.stringify({ service: 'three-bucket-api', version: '2.0.0' })); } }); server.listen(process.env.PORT || 3000, () => console.log('API running on port', process.env.PORT || 3000));"
    healthCheckPath: /healthz
    autoDeploy: true
    scaling:
      minInstances: 2
      maxInstances: 10
      targetCPUPercent: 75
      targetMemoryPercent: 80
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: three-bucket-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: three-bucket-redis
          property: connectionString

  # 3. Asynchronous Background Task & Calculation Worker
  - type: worker
    name: three-bucket-worker
    runtime: node
    plan: standard
    region: oregon
    buildCommand: npm install
    startCommand: node -e "console.log('Worker listening for async simulation jobs...'); setInterval(() => {}, 1000);"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: three-bucket-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: three-bucket-redis
          property: connectionString

databases:
  # 4. Managed PostgreSQL 16 Enterprise Relational Database
  - name: three-bucket-postgres
    region: oregon
    plan: standard
    databaseName: three_bucket_db
    user: db_admin
    postgresMajorVersion: "16"

  # 5. Managed In-Memory Redis Cache & Queue Broker
  - name: three-bucket-redis
    region: oregon
    plan: standard
    ipAllowList: [] # Private network only
