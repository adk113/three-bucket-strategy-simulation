services:
  # 1. Full-Stack Web Application & REST API (Render Web Service)
  - type: web
    name: three-bucket-strategy-simulation
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:web
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

  # 2. Production Backend API (Render Web Service)
  - type: web
    name: three-bucket-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

  # 3. Asynchronous Background Task & Calculation Worker
  - type: worker
    name: three-bucket-worker
    runtime: node
    plan: standard
    region: oregon
    buildCommand: npm install
    startCommand: node -e "console.log('Worker listening for async simulation jobs...'); setInterval(() => {}, 1000);"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: three-bucket-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: three-bucket-redis
          property: connectionString

databases:
  # 4. Managed PostgreSQL 16 Enterprise Relational Database
  - name: three-bucket-postgres
    region: oregon
    plan: standard
    databaseName: three_bucket_db
    user: db_admin
    postgresMajorVersion: "16"

  # 5. Managed In-Memory Redis Cache & Queue Broker
  - name: three-bucket-redis
    region: oregon
    plan: standard
    ipAllowList: [] # Private network only
